name: CI

on:
  push:
    branches: [main, stabilisasi]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Build Next.js di runner GitHub perlu heap lebih besar.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

  db:
    # Verifikasi hak akses & siklus pinjam pada Supabase lokal (Docker di runner).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Supabase lokal
        run: npx supabase start --exclude studio,analytics,vector,edge-runtime,imgproxy

      - name: Seed akun demo
        run: |
          # Output CLI menyertakan baris non-KV ("Stopped services: [...]");
          # satu baris invalid membuat GitHub membuang SELURUH isi $GITHUB_ENV.
          # Jadi supabase.env difilter ke baris KEY=VALUE saja sebelum dipakai.
          npx supabase status -o env | grep -E '^[A-Z_]+=' > supabase.env
          cat supabase.env >> "$GITHUB_ENV"
          # CLI menulis API_URL / ANON_KEY / SECRET_KEY (bukan SUPABASE_URL).
          # Skrip test membaca SUPABASE_TEST_URL / SUPABASE_TEST_ANON_KEY /
          # SUPABASE_TEST_SERVICE_ROLE_KEY; seed-dummy membaca NEXT_PUBLIC_* & SUPABASE_SECRET_KEY.
          # nilai ditulis CLI dengan tanda kutip: API_URL="http://..." -> kutip dilepas
          api_url="$(grep -E '^API_URL=' supabase.env | cut -d= -f2- | tr -d '"')"
          anon_key="$(grep -E '^ANON_KEY=' supabase.env | cut -d= -f2- | tr -d '"')"
          secret_key="$(grep -E '^SECRET_KEY=' supabase.env | cut -d= -f2- | tr -d '"')"
          pub_key="$(grep -E '^PUBLISHABLE_KEY=' supabase.env | cut -d= -f2- | tr -d '"')"
          {
            echo "SUPABASE_TEST_URL=$api_url"
            echo "SUPABASE_TEST_ANON_KEY=$anon_key"
            echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$secret_key"
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$pub_key"
            echo "SUPABASE_SECRET_KEY=$secret_key"
          } >> "$GITHUB_ENV"
          npx tsx scripts/seed-dummy.ts
          rm -f supabase.env

      - name: Uji RLS dan hak akses
        run: npx tsx scripts/test-rls.ts

      - name: Uji siklus pinjam dan stok
        run: npx tsx scripts/test-inventory-admin.ts

      - name: Uji matriks hak akses per role
        run: npx tsx scripts/test-role-matrix.ts

      - name: Uji konfigurasi SECURITY DEFINER helper
        run: ./scripts/run-db-checks.sh
