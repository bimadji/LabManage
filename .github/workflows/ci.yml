name: CI

on:
  push:
    branches: [main, stabilisasi]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Build Next.js di runner GitHub perlu heap lebih besar.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

  db:
    # Verifikasi hak akses & siklus pinjam pada Supabase lokal (Docker di runner).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Supabase lokal
        run: npx supabase start --exclude studio,analytics,vector,edge-runtime,imgproxy

      - name: Seed akun demo
        run: |
          npx supabase status -o env > supabase.env
          cat supabase.env >> "$GITHUB_ENV"
          # CLI menulis API_URL / ANON_KEY / SERVICE_ROLE_KEY (bukan SUPABASE_URL).
          # Skrip test membaca SUPABASE_TEST_URL / SUPABASE_TEST_ANON_KEY / SUPABASE_TEST_SERVICE_ROLE_KEY.
          echo "SUPABASE_TEST_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
          # seed-dummy membaca .env.local; dotenv tidak menimpa env yang sudah ada
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
          npx tsx scripts/seed-dummy.ts
          rm -f supabase.env

      - name: Uji RLS dan hak akses
        run: npx tsx scripts/test-rls.ts

      - name: Uji siklus pinjam dan stok
        run: npx tsx scripts/test-inventory-admin.ts

      - name: Uji matriks hak akses per role
        run: npx tsx scripts/test-role-matrix.ts

      - name: Uji konfigurasi SECURITY DEFINER helper
        run: ./scripts/run-db-checks.sh
