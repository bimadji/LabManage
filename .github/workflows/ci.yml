name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start Supabase lokal
        working-directory: .
        run: supabase start
      - name: Tulis api/.env.test dari Supabase lokal
        working-directory: .
        run: |
          supabase status -o env \
            | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' \
            | sed -e 's/^API_URL=/SUPABASE_URL=/' \
                  -e 's/^ANON_KEY=/SUPABASE_ANON_KEY=/' \
                  -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' \
            > api/.env.test
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
